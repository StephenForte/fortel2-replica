# Local / VPS smoke: stock verifier for ForteL2 chain 852.
#   cp .env.example .env          # L1_RPC_URL already set to publicnode
#   openssl rand -hex 32 > jwt.txt && chmod 600 jwt.txt
#   docker compose up -d
# EL http://127.0.0.1:9545  op-node http://127.0.0.1:9547
# Compose reads L1_RPC_URL (required), L1_BLOCK_TIME, L1_HTTP_POLL_INTERVAL,
# L1_RPC_RATE_LIMIT, L1_CACHE_SIZE, L1_MAX_CONCURRENCY, L1_RPC_MAX_BATCH_SIZE,
# L1_RPC_KIND, RETH_CROSS_BLOCK_CACHE_MB, RETH_RPC_CACHE_MAX_BLOCKS.
# Schedule / JWT_SECRET / OP_NODE_GOMEMLIMIT are Render-only.
#
# Official op-reth / op-node images are distroless (no /bin/sh). Init + start
# stay in the command list so we do not need a shell on the EL image.

services:
  op-reth:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:v2.3.3@sha256:eec35eaafb6f8b3d07c6844ff87c4f8af81fca088472b6a432435c53a36b8a4c
    volumes:
      - reth-data:/data
      - ./config/genesis.json:/config/genesis.json:ro
      - ./jwt.txt:/config/jwt.txt
    entrypoint: ["op-reth"]
    command:
      - node
      - --chain=/config/genesis.json
      - --datadir=/data
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3
      - --http.corsdomain=*
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/config/jwt.txt
      - --full
      - --rollup.disable-tx-pool-gossip
      - --disable-discovery
      - --max-peers=0
      - --engine.cross-block-cache-size=${RETH_CROSS_BLOCK_CACHE_MB:-256}
      - --rpc-cache.max-blocks=${RETH_RPC_CACHE_MAX_BLOCKS:-256}
    ports:
      - "9545:8545"

  op-node:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.19.2@sha256:3652c0faa7582e49c31a71f86bc5170167499aed7e382e92722f34beb233ef1a
    depends_on:
      - op-reth
    volumes:
      - ./config/rollup.json:/config/rollup.json:ro
      - ./jwt.txt:/config/jwt.txt:ro
    environment:
      L1_RPC_URL: ${L1_RPC_URL:?set L1_RPC_URL in .env}
      L1_BLOCK_TIME: ${L1_BLOCK_TIME:-12}
      L1_HTTP_POLL_INTERVAL: ${L1_HTTP_POLL_INTERVAL:-24s}
      L1_RPC_RATE_LIMIT: ${L1_RPC_RATE_LIMIT:-5}
      L1_CACHE_SIZE: ${L1_CACHE_SIZE:-128}
      L1_MAX_CONCURRENCY: ${L1_MAX_CONCURRENCY:-2}
      L1_RPC_MAX_BATCH_SIZE: ${L1_RPC_MAX_BATCH_SIZE:-5}
      L1_RPC_KIND: ${L1_RPC_KIND:-quicknode}
    command:
      - op-node
      - --l1=${L1_RPC_URL}
      - --l1.rpckind=${L1_RPC_KIND:-quicknode}
      - --l1.trustrpc=true
      - --l1.http-poll-interval=${L1_HTTP_POLL_INTERVAL:-24s}
      - --l1.rpc-rate-limit=${L1_RPC_RATE_LIMIT:-5}
      - --l1.cache-size=${L1_CACHE_SIZE:-128}
      - --l1.max-concurrency=${L1_MAX_CONCURRENCY:-2}
      - --l1.rpc-max-batch-size=${L1_RPC_MAX_BATCH_SIZE:-5}
      - --l1.beacon.ignore=true
      - --l1.beacon.slot-duration-override=${L1_BLOCK_TIME:-12}
      - --l2=http://op-reth:8551
      - --l2.jwt-secret=/config/jwt.txt
      - --l2.enginekind=reth
      - --rollup.config=/config/rollup.json
      - --sequencer.enabled=false
      - --verifier.l1-confs=1
      - --p2p.disable=true
      - --rpc.addr=0.0.0.0
      - --rpc.port=9545
      - --log.level=info
    ports:
      - "9547:9545"

volumes:
  reth-data:
