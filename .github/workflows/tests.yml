name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-integration:
    name: Python and Docker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (node24)
        with:
          python-version: "3.11"

      - name: Check shell syntax
        run: |
          sh -n entrypoint.sh
          sh -n healthcheck.sh
          sh -n sequencer-read/start.sh
          sh -n gateway/14-resolvers-from-resolv.conf.envsh

      - name: Check Python syntax
        run: |
          python -m py_compile \
            rpc-method-filter.py \
            l1_rpc_router.py \
            tests/*.py

      - name: Run test suite
        run: python -m unittest discover -s tests -v
