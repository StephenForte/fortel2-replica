# Render Blueprint — ForteL2 L2 verifier (stock op-geth + op-node).
#
# This file defines exactly one service, by decision (R-0008): the private
# replica. The public gateway is not declared here. Create it from the
# Dashboard — see README "Going public".
#
# LIVE (Oregon): Private Service `fortel2-replica` with a 50 GB disk at /data.
# JSON-RPC reads go through the method filter on PORT (default 10000).
# op-geth and op-node bind loopback only; only the filter is reachable
# on the private network. Public traffic hits diskless Web Services
# `fortel2-replica-rpc` and `fortel2-sequencer-rpc` (not this Blueprint).
#
# Do NOT apply this file as a **new** Blueprint onto the live Oregon pserv.
# Render cannot reattach the live 50 GB disk. A new apply of this Blueprint
# (`type: pserv` / `sizeGB: 20`) would create a second replica with an empty
# disk and a full L1 resync. Keep deploying this image onto the existing
# pserv. See README "Do not convert this service to Web" and "Going public"
# / "Revert".
#
# sizeGB: 20 below is the greenfield minimum, not the live disk. Do not
# "fix" live to 20. Raising 20→50 on a *new* apply still creates an empty
# 50 GB volume.
#
# Public URL (live): Dashboard Web Service `fortel2-replica-rpc` (no disk),
# Dockerfile `./gateway/Dockerfile`, context `./gateway`, same Oregon env,
# upstream http://fortel2-replica:10000. Sequencer tip: `fortel2-sequencer-rpc`
# (`sequencer-read/start.sh`). Do not point a Web Service at ./Dockerfile.
# Do not add those services to this file — a Blueprint apply cannot attach
# them to the live unattached pserv; it would create its own replica
# instead (R-0008).
#
# Greenfield replica only: New → Blueprint → this repo (then the service
# stays Blueprint-managed). Live services are Dashboard-created and
# unattached. On Blueprint sync, envVars with `value:` are applied/updated.
# Keys with `sync: false` (L1_RPC_URL, JWT_SECRET) are prompted only on
# first create; later syncs ignore them — set/rotate those secrets in the
# dashboard.
#
# If you instead create a Private Service from the dashboard (not via this
# Blueprint), it is unattached to render.yaml — paste the README checklist.
#
# Credit schedule (observe): L1_RPC_SCHEDULE=business → QuickNode 09:00–17:00
# America/Los_Angeles, publicnode overnight. Overrides:
#   L1_RPC_FORCE=public|metered  or  L1_USE_PUBLIC_RPC=1
# Memory policy: Wave 1 on Standard (R-0012). Do not apply this file onto the
# live pserv. Wave 2 is dashboard env only after a measured 1.6–1.9 GB peak.
#
# Dashboard replica: New → Private Service → Runtime Docker → root Dockerfile.
# Attach a persistent disk at /data (≥20 GB; live is 50 GB).

services:
  - type: pserv
    name: fortel2-replica
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    # Filter answers GET / with {"ok":true,...} for Render's private-network probe.
    healthCheckPath: /
    disk:
      name: fortel2-replica-data
      mountPath: /data
      sizeGB: 20
    envVars:
      - key: L1_RPC_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: L1_BLOCK_TIME
        value: "12"
      - key: GETH_CACHE_MB
        value: "128"
      - key: GETH_FDLIMIT
        value: "4096"
      # Go soft caps — keep geth + op-node under Standard (2GB) during derivation bursts
      - key: GETH_GOMEMLIMIT
        value: 700MiB
      - key: OP_NODE_GOMEMLIMIT
        value: 768MiB
      # Shrink op-node L1 receipt cache (upstream default 900 OOMs 2GB during catch-up)
      - key: L1_CACHE_SIZE
        value: "128"
      - key: L1_MAX_CONCURRENCY
        value: "2"
      - key: L1_RPC_MAX_BATCH_SIZE
        value: "5"
      - key: TZ
        value: America/Los_Angeles
      # business = 09:00–17:00 QuickNode (L1_RPC_URL), else public overnight
      - key: L1_RPC_SCHEDULE
        value: business
      - key: L1_USE_PUBLIC_RPC
        value: "0"
      - key: L1_RPC_PUBLIC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: L1_RPC_BUSINESS_START
        value: "9"
      - key: L1_RPC_BUSINESS_END
        value: "17"
      # Soft self-throttle (publicnode + QuickNode)
      - key: L1_HTTP_POLL_INTERVAL
        value: "24s"
      - key: L1_RPC_RATE_LIMIT
        value: "5"
