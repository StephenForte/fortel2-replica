# Render Blueprint — ForteL2 L2 verifier (stock op-geth + op-node).
# Public Web Service: JSON-RPC reads via the method filter on PORT (default 10000).
# op-geth and op-node bind loopback only; only the filter is edge-reachable.
#
# Blueprint env vars apply to NEW services only. Existing services do not sync
# from this file — copy the tables in README.md → Render → Manual setup.
#
# IMPORTANT: Render cannot convert Private Service (pserv) → Web Service in place.
# If fortel2-replica is still a Private Service, create a new Web Service from
# this Blueprint (or Dashboard) and attach/migrate the /data disk. To revert to
# private: recreate as type pserv (or Dashboard → Private Service) with the same
# disk/env; see README "Public read RPC → Revert".
#
# Dashboard: New → Blueprint → this repo. Set L1_RPC_URL secret (QuickNode).
#
# Credit schedule (observe): L1_RPC_SCHEDULE=business → QuickNode 09:00–17:00
# America/Los_Angeles, publicnode overnight. Overrides:
#   L1_RPC_FORCE=public|metered  or  L1_USE_PUBLIC_RPC=1
#
# Or: New → Web Service → Runtime Docker → root Dockerfile.
# Attach a persistent disk at /data (≥20 GB).

services:
  - type: web
    name: fortel2-replica
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    # Filter answers GET / with {"ok":true,...} for Render's edge probe.
    healthCheckPath: /
    disk:
      name: fortel2-replica-data
      mountPath: /data
      sizeGB: 20
    envVars:
      - key: L1_RPC_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: L1_BLOCK_TIME
        value: "12"
      - key: GETH_CACHE_MB
        value: "128"
      # Go soft caps — keep geth + op-node under Standard (2GB) during derivation bursts
      - key: GETH_GOMEMLIMIT
        value: 700MiB
      - key: OP_NODE_GOMEMLIMIT
        value: 768MiB
      - key: TZ
        value: America/Los_Angeles
      # business = 09:00–17:00 QuickNode (L1_RPC_URL), else public overnight
      - key: L1_RPC_SCHEDULE
        value: business
      - key: L1_USE_PUBLIC_RPC
        value: "0"
      - key: L1_RPC_PUBLIC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: L1_RPC_BUSINESS_START
        value: "9"
      - key: L1_RPC_BUSINESS_END
        value: "17"
      # Soft self-throttle (publicnode + QuickNode)
      - key: L1_HTTP_POLL_INTERVAL
        value: "24s"
      - key: L1_RPC_RATE_LIMIT
        value: "5"
