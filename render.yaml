# Render Blueprint — ForteL2 L2 verifier (op-reth).
#
# Do NOT re-apply this file as a new Blueprint onto the live Oregon
# environment. Live `fortel2-replica-reth` is Dashboard-created and
# unattached (D-0128 / R-0008). A new apply creates empty-disk
# services and a full L1 resync — it does not attach the live disk.
# Keep deploying the *existing* pserv. See README "Do not convert
# this service to Web" and "Going public".
#
# Declared objects (operator-applied, R-0013 / R-0017):
# `fortel2-replica-reth` (pserv; live dashboard disk is 10 GB —
# D-0127 / #49; grow to ≈25 GB before 2026-10-20 as a dashboard
# resize, not a Blueprint apply) and diskless staging gateway
# `fortel2-replica-reth-rpc` (suspend 2026-09-12 after 17:25Z).
# Never mutate disk name `fortel2-replica-reth-data` or
# Dashboard-created `fortel2-replica-rpc`. Phase C executed as
# two env edits to http://fortel2-replica-reth:10000 — not a
# rename-swap. Render private hostnames are immutable slugs;
# renaming moves no traffic.
#
# Public URL (live): Dashboard Web Service `fortel2-replica-rpc`
# (no disk), Dockerfile `./gateway/Dockerfile`, context `./gateway`,
# same Oregon env, upstream http://fortel2-replica-reth:10000
# (R-0017). Sequencer tip: `fortel2-sequencer-rpc`
# (`sequencer-read/start.sh`). Do not point a Web Service at
# `Dockerfile.reth` (that boots a second public verifier). Do not
# attach `fortel2-replica-rpc` to this Blueprint (R-0008).
#
# Greenfield replica only: New → Blueprint → this repo (then the
# service stays Blueprint-managed). Live services are
# Dashboard-created and unattached. On Blueprint sync, envVars
# with `value:` are applied/updated. Keys with `sync: false`
# (`L1_RPC_URL`) are prompted only on first create; later syncs
# ignore them — set/rotate those secrets in the dashboard.
#
# If you instead create a Private Service from the dashboard (not
# via this Blueprint), it is unattached to render.yaml — paste the
# README checklist.
#
# Credit schedule (observe): L1_RPC_SCHEDULE=business → QuickNode
# 09:00–17:00 America/Los_Angeles, publicnode overnight. Overrides:
#   L1_RPC_FORCE=public|metered  or  L1_USE_PUBLIC_RPC=1
# Memory policy: Standard (R-0017 Q5). Do not apply this file onto
# the live pserv.
#
# Dashboard replica: New → Private Service → Runtime Docker →
# Dockerfile.reth. Attach a persistent disk at /data (live is 10 GB;
# grow to ≈25 GB before 2026-10-20).

services:
  # --- Task 7 (R-0013): operator-applied. Initial sync is
  # L1_RPC_FORCE=metered (D-0105: publicnode returns 0 receipts). JWT is
  # generated in-container — do not paste the Mac's JWT_SECRET.
  # Memory is measured in Phase B before any plan change; Standard
  # 2 GB is the starting plan.
  - type: pserv
    name: fortel2-replica-reth
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile.reth
    dockerContext: .
    region: oregon
    # Filter answers GET / with {"ok":true,...} for Render's private-network probe.
    healthCheckPath: /
    disk:
      name: fortel2-replica-reth-data
      mountPath: /data
      # Live dashboard disk is 10 GB (D-0127 / #49). This value is
      # documentation: the Blueprint is never applied (D-0128).
      # Standing follow-up: grow to ≈25 GB before 2026-10-20 (R-0017)
      # as a dashboard resize, not a Blueprint apply.
      sizeGB: 10
    envVars:
      - key: L1_RPC_URL
        sync: false
      - key: L1_BLOCK_TIME
        value: "12"
      # Replaces GETH_CACHE_MB. Pinned op-reth default is 4096 MB (OOM on Standard).
      - key: RETH_CROSS_BLOCK_CACHE_MB
        value: "256"
      - key: RETH_RPC_CACHE_MAX_BLOCKS
        value: "256"
      # Go soft cap stays for op-node only (op-reth is Rust).
      - key: OP_NODE_GOMEMLIMIT
        value: 768MiB
      - key: L1_CACHE_SIZE
        value: "128"
      - key: L1_MAX_CONCURRENCY
        value: "2"
      - key: L1_RPC_MAX_BATCH_SIZE
        value: "5"
      - key: L1_RPC_KIND
        value: quicknode
      - key: TZ
        value: America/Los_Angeles
      # Initial derive is metered only. Re-enable schedule after catch-up
      # and only if a 60-min overnight-leg observation advances (Phase B.5).
      - key: L1_RPC_FORCE
        value: metered
      - key: L1_RPC_SCHEDULE
        value: "off"
      - key: L1_USE_PUBLIC_RPC
        value: "0"
      - key: L1_RPC_PUBLIC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: L1_RPC_BUSINESS_START
        value: "9"
      - key: L1_RPC_BUSINESS_END
        value: "17"
      - key: L1_HTTP_POLL_INTERVAL
        value: "24s"
      - key: L1_RPC_RATE_LIMIT
        value: "5"
      # Snapshot bootstrap (R-0014 / D-0123): operator dashboard only — do not
      # put RETH_SNAPSHOT_URL / RETH_SNAPSHOT_SHA256 / RETH_SNAPSHOT_FORCE in
      # this Blueprint. On first boot with an empty disk, set URL + SHA256
      # (GitHub release asset of db/ + static_files/ + rocksdb/, hash from the
      # .sha256 manifest). To replace the paused 68 % derive, set FORCE=1 once;
      # current db/static_files/rocksdb is removed only after download/hash/extract
      # succeed. Then UNSET FORCE after the restore boot. After restore, switch
      # L1_RPC_FORCE to public (tip-follow; publicnode prunes old receipts).
      # Archive mode (D-0126 / R-0015): operator dashboard RETH_ARCHIVE=1 before
      # restore so op-reth omits --full and retains historical receipts/logs.
      # Also deletes $DATA_DIR/reth.toml if present — a prior --full boot
      # persists [prune] segments there; omitting --full does not clear them.
      # Unset/0 is --full prune (reth.toml untouched). Do not put RETH_ARCHIVE
      # in this Blueprint (a synced 0 would prune a restored archive datadir).
      # reth has no --archive flag. FORCE restore also drops reth.toml (jwt kept).

  # Staging gateway — verification-only; suspend 2026-09-12 after 17:25Z
  # (R-0017). REPLICA_UPSTREAM is a literal (R-0004): never fromService.
  - type: web
    name: fortel2-replica-reth-rpc
    runtime: docker
    plan: starter
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: ./gateway
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: REPLICA_UPSTREAM
        value: http://fortel2-replica-reth:10000
      - key: RPC_RATE
        value: 20r/s
      - key: RPC_BURST
        value: "40"
      - key: RPC_REAL_IP_HEADER
        value: CF-Connecting-IP
      - key: RPC_MAX_BODY
        value: 1m
